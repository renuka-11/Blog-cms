<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Blog CMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Blog CMS Admin Panel</h1>
    
    <!-- Navigation -->
    <div class="nav-bar">
      <a href="index.html">Home</a>
      <a href="admin.html" class="active">Admin Panel</a>
    </div>

    <!-- Login Form (shown when not authenticated) -->
    <div id="login-section" class="section">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email:</label>
          <input type="email" id="loginEmail" required>
        </div>
        
        <div class="form-group">
          <label for="loginPassword">Password:</label>
          <input type="password" id="loginPassword" required>
        </div>
        
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p class="form-toggle">
        New here? <a href="#" onclick="showSignupSection(); return false;">Create an account</a>
      </p>
      <!-- <p class="demo-credentials">
        Demo: admin@blogcms.com / Admin@123456<br>
        Editor: editor@blogcms.com / Editor@123456
      </p> -->
    </div>

    <!-- Signup Form (shown when user wants to register) -->
    <div id="signup-section" class="section" style="display: none;">
      <h2>Sign Up</h2>
      <form id="signupForm">
        <div class="form-group">
          <label for="signupFullName">Full Name:</label>
          <input type="text" id="signupFullName" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email:</label>
          <input type="email" id="signupEmail" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password:</label>
          <input type="password" id="signupPassword" required>
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
      <p class="form-toggle">
        Already have an account? <a href="#" onclick="showLoginSection(); return false;">Login here</a>
      </p>
    </div>

    <!-- Post Form (shown when authenticated) -->
    <div id="post-section" class="section" style="display: none;">
      <div class="user-info">
        <span id="userDisplay"></span>
        <button onclick="logout()" class="btn-logout">Logout</button>
      </div>
      
      <h2>Create New Post</h2>
      <form id="addPostForm">
        <div class="form-group">
          <label for="postTitle">Title:</label>
          <input type="text" id="postTitle" required>
        </div>

        <div class="form-group">
          <label for="postCategory">Category:</label>
          <select id="postCategory" required>
            <option value="">Select Category</option>
            <option value="Tech">Tech</option>
            <option value="College">College/Education</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="News">News/Announcement</option>
          </select>
        </div>

        <div class="form-group">
          <label for="postContent">Content:</label>
          <textarea id="postContent" rows="8" required></textarea>
        </div>

        <button type="submit" class="btn-primary">Add Post</button>
      </form>

      <hr>

      <h2>Your Posts</h2>
      <div id="user-posts-container"></div>
    </div>

    <!-- Message Container -->
    <div id="message-container"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
